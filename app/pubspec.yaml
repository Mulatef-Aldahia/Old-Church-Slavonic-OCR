name: oko
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private projects.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version name and the version number may be overridden in
# flutter build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while version number is used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while version number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, the build-name is used as the major, minor and patch parts
# of the product and file versions while the build-number is used as the
# build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your project needs. To automatically
# upgrade your package dependencies to the latest available versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# the dependencies can be manually changed in the version numbers below to
# the latest versions available on pub.dev. To see which packages have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # اختيار الصورة من معرض الجهاز (مربع إدخال الصورة)
  image_picker: ^1.1.2

  # تشغيل موديل ONNX داخل التطبيق (الموديل oko_model.onnx)
  flutter_onnxruntime: ^1.8.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The flutter_lints package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the analysis_options.yaml file located in the root of your
  # package. For more information, see the lints documentation.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#E2CFAE"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#E2CFAE"
    theme_color: "#3E2C1E"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section here, like this:
  assets:
    - assets/models/
    - assets/fonts/
    - assets/Images/

  # To add custom fonts to your application, add a fonts section here, in this
  # "flutter" section. Each entry in this list must have a "family" key with a
  # font name, and a "fonts" key with a list giving the asset and other
  # descriptors for the font. For example:
  # خط الحروف المكتشفة فقط (يُستخدم لعرض الحروف، والواجهة كلها بخط النظام العادي)
  fonts:
    - family: OkoGlyph
      fonts:
        - asset: assets/fonts/KlimentStd.ttf
